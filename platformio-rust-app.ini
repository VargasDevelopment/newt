; The one firmware build: the Rust app with the regional gray SDK and DEV USB.
; tools/firmware-build.py adds its Git build ID in a generated copy.
[platformio]
default_envs = newt_x3
src_dir = .
include_dir = rust/firmware/native
core_dir = .toolchain/platformio
build_dir = .build/rust-app/native/build
libdeps_dir = .build/rust-app/native/libdeps

[env:newt_x3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = rust/firmware/x3_existing_partitions.csv
monitor_speed = 115200
build_src_filter = +<rust/firmware/native/entry.cpp> +<rust/target-expat/native/xml_budget.cpp> +<rust/salamander/board/native/board.cpp> +<rust/salamander/board/native/grayscale.cpp> +<rust/salamander/board/native/image.cpp> +<rust/salamander/board/native/hardware.cpp> +<rust/salamander/board/native/retained.cpp> +<rust/salamander/input/native/atomic_bridge.cpp> +<rust/salamander/input/native/input_bridge.cpp> +<rust/salamander/input/native/task_owner.cpp> +<rust/salamander/native_io/native/native_io.c> +<rust/salamander/native_io/native/posix_directory.c> +<rust/salamander/native_io/native/download.c> +<rust/salamander/native_io/native/page_entries.cpp> +<rust/salamander/native_io/native/library_folders.cpp> +<rust/firmware/native/cover.cpp> +<rust/firmware/native/wifi.cpp> +<rust/firmware/native/wifi_memory_report.cpp> +<rust/firmware/native/update_https.cpp> +<rust/firmware/serial_console/native/serial_console.cpp> +<rust/firmware/nvs/sdk_shim.cpp> +<rust/salamander/nvs_guard/sdk_glue.cpp> +<rust/firmware/fonts/native/native.c> +<rust/firmware/reader_hash_layout.cpp> +<rust/target-expat/native/expat_bridge.c> +<rust/salamander/sdk-heap/native/native_alloc.c>
extra_scripts = post:tools/rust_app_link.py
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++2a
	-fstack-usage
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
	-DFREEINK_DEVICE_X3=1
	-DFREEINK_BOOK_SMALL=1
	-DESP32_ARDUINO_NO_RGB_BUILTIN
	-L.build/rust-app/ld
	-Wl,--wrap=XML_ParserCreate
	-Wl,--wrap=nvs_flash_init
	-Wl,--wrap=nvs_open
	-Wl,--wrap=esp_partition_erase_range
	-Wl,--wrap=esp_partition_write
	-Wl,--wrap=esp_partition_write_raw
	-Wl,--wrap=nvs_flash_erase
	-Wl,--wrap=nvs_flash_erase_partition
	-Wl,--wrap=nvs_flash_erase_partition_ptr
	-Wl,--wrap=esp_panic_handler
	-Wl,--wrap=esp_backtrace_print
	-Wl,--wrap=ets_install_putc1
	-Wl,--wrap=ets_install_putc2
	-D__wrap_esp_panic_handler=arduino_unused_wrap_esp_panic_handler
	-Wl,--wrap=soc_get_available_memory_regions
	-Wl,--wrap=heap_caps_enable_nonos_stack_heaps
	-DFREEINK_EXPERIMENTAL_REGIONAL_GRAY=1
	-DNEWT_DEV_USB=1
	-Irust/salamander/input/native
	-I.build/freeink-reader-sdk-regional-dev-usb/libs/book/FreeInkBook/third_party/expat
	-I.build/freeink-reader-sdk-regional-dev-usb/libs/book/FreeInkBook/third_party/libunibreak
	-I.build/freeink-reader-sdk-regional-dev-usb/libs/font/FreeInkFont/third_party/freetype/include
	-I.build/freeink-reader-sdk-regional-dev-usb/libs/font/FreeInkFont/include
lib_deps =
	BoardConfig=symlink://.build/freeink-reader-sdk-regional-dev-usb/libs/hardware/BoardConfig
	EInkDisplay=symlink://.build/freeink-reader-sdk-regional-dev-usb/libs/display/FreeInkDisplay
	InputManager=symlink://.build/freeink-reader-sdk-regional-dev-usb/libs/hardware/InputManager
	BatteryMonitor=symlink://.build/freeink-reader-sdk-regional-dev-usb/libs/hardware/BatteryMonitor
	XteinkDetect=symlink://.build/freeink-reader-sdk-regional-dev-usb/libs/hardware/XteinkDetect
	PowerManager=symlink://.build/freeink-reader-sdk-regional-dev-usb/libs/hardware/PowerManager
	FreeInkFont=symlink://.build/freeink-reader-sdk-regional-dev-usb/libs/font/FreeInkFont
	FreeInkUI=symlink://.build/freeink-reader-sdk-regional-dev-usb/libs/ui/FreeInkUI
	FreeInkBook=symlink://.build/freeink-reader-sdk-regional-dev-usb/libs/book/FreeInkBook
