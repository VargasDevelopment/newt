[package]
name = "newt-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Unlicense"
publish = false

[features]
dev-usb = []
# Opt-in page-turn diagnostic trace; never enabled in shipping builds.
page-turn-trace = []
# Pinned-translation harnesses compare against oracles that never ran the
# open-time member check, so they build unchecked members. Never on firmware.
pinned-harness = []

[dependencies]
salamander-device = { path = "../salamander/device" }

# Integration tests include pinned-translation harnesses (see pinned-harness).
[dev-dependencies]
newt-core = { path = ".", features = ["pinned-harness"] }

# Needs the shared slot vectors, so only tests/slot_vectors_test.py runs it
# (with them and its negative controls); a plain cargo test skips it.
[[test]]
name = "slot_vectors"
path = "../tests/slot_vectors/vectors.rs"
test = false

# The bridge's card write over a fake card; tests/dev_put_test.py runs it
# with its negative controls.
[[test]]
name = "dev_put"
path = "../tests/dev_put/lease.rs"
test = false

# Live frame capture over HWCDC's 256-byte ring buffer and 64-byte EP1 IN FIFO;
# tests/dev_usb_live_capture_test.py runs it with its negative controls.
[[test]]
name = "dev_usb_live_capture"
path = "../tests/dev_usb_live_capture/capture.rs"
test = false
