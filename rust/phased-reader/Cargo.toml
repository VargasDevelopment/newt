[package]
name = "newt-phased-reader"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[features]
dev-usb = ["newt-core/dev-usb"]
page-turn-trace = ["newt-core/page-turn-trace"]
native-host = []
style-recapture-fixture = []

[[bin]]
name = "phased-reader-host"
path = "host/main.rs"
required-features = ["native-host"]

[dependencies]
newt-core = { path = "../core" }
newt-reader-atlas = { path = "../reader-atlas" }
newt-reader-navigation = { path = "../reader-navigation" }
newt-phased-sink = { path = "../phased-sink" }
newt-target-expat = { path = "../target-expat" }

# Large-EPUB boundary corpus runner; tests/large_epub_corpus_test.py builds and
# runs it with generated fixtures and negative controls.
[[test]]
name = "large_epub_corpus"
path = "../tests/large_epub_corpus/corpus.rs"
test = false
