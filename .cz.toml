[tool.commitizen]
# Newt's plugin (tools/cz_newt), registered under its own path: when it is
# missing, Commitizen's "Try running 'pip install NAME'" names the local package.
name = "./tools/cz_newt"
version = "0.5.1-dev.20261125.12"
version_scheme = "semver2"
version_provider = "commitizen"
version_files = ["rust/firmware/native/firmware_version.h:NEWT_FIRMWARE_VERSION"]
tag_format = "v$version"
major_version_zero = true
prerelease_offset = 0
bump_message = "chore(release): $current_version -> $new_version"
allowed_prefixes = []
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
template = "tools/changelog.md.j2"
